[project]
name = "sparserdiff"
version = "1.1.0+sparserdiff"
description = "SparseDiff (qym7/SparseDiff@d9c4b20) with the SparserDiff edge sampler"
requires-python = "==3.9.*"
dependencies = [
    "torch==2.0.1",
    "torch-geometric==2.3.1",
    "pytorch-lightning==2.0.4",
    "torchmetrics==0.11.4",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "numpy==1.23.5",
    "pandas==1.4.4",
    "networkx==2.8.7",
    "scipy==1.11.1",
    "pyemd==1.0.0",
    "pygsp==0.5.1",
    "imageio==2.31.1",
    "matplotlib==3.7.1",
    "overrides==7.3.1",
    "setuptools==68.0.0",
    "tqdm==4.65.0",
    "wandb==0.15.4",
    "rdkit==2023.3.2",
    "fcd-torch",
    "scikit-learn",
    "dgl==1.1.2",
    "psutil",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sparse_diffusion*"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]
