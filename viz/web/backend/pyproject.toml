[project]
name = "viz-web-backend"
version = "0.1.0"
description = "FastAPI backend for the DiGress timestep viewer (viz/web)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.1",
    "uvicorn>=0.37.0",
    "numpy<2",
    "rdkit>=2025.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viz_backend"]
