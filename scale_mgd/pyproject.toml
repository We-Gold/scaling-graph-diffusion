[project]
name = "scale-mgd"
version = "0.1.0"
description = "Scale-MGD: sparse masked graph diffusion (MQP report sec. 4.1, 5.3)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "matplotlib>=3.10",
    "networkx>=3.5",
    "numpy<2",
    "pandas>=2.3",
    "pyyaml>=6.0",
    "rdkit>=2025.3.6",
    "scipy>=1.16",
    "torch>=2.8.0,<2.9",
    "torch-geometric>=2.6.1,<2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scale_mgd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet (downloads Planar)"]
addopts = "-m 'not network'"
