[project]
name = "edge-sampling"
version = "0.1.0"
description = "SparserDiff Experiment 1: edge sampling memory and time benchmark (report 5.2, table 9, fig 6)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy",
]

[project.scripts]
edge-sampling-benchmark = "edge_sampling.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_sampling"]
